      - name: Config and ensure submodules
        run: |
          ensure_submodule() {
            local path="$1"
            local url="$2"
            if [ ! -e "$path/.git" ]; then
              echo "Submodule $path missing .git, cloning from $url..."
              rm -rf "$path"
              git clone --depth 1 "$url" "$path"
            fi
          }
          ensure_submodule "libs/mmkv/MMKV" "https://github.com/cinit/MMKV"
          ensure_submodule "libs/stub/qq-stub" "https://github.com/LuckyPray/qq-stub"
          ensure_submodule "libs/dexkit/DexKit" "https://github.com/LuckyPray/DexKit"
          ensure_submodule "libs/linux-syscall-support" "https://chromium.googlesource.com/linux-syscall-support"
          ensure_submodule "libs/Dobby" "https://github.com/LSPosed/Dobby"
          ensure_submodule "libs/libunwindstack" "https://github.com/cinit/libunwindstack"
          ensure_submodule "libs/xView/EasyAdapter" "https://github.com/Hicores/EasyAdapter"
          ensure_submodule "libs/xView/XPopup" "https://github.com/Hicores/XPopup"
          ensure_submodule "libs/fmt" "https://github.com/fmtlib/fmt"
          ensure_submodule "libs/LSPlant" "https://github.com/LSPosed/LSPlant"

          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsprism.update" none || true
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsparself.update" none || true
          git -C "libs/LSPlant" config "submodule.docs/doxygen-awesome-css.update" none || true
          git -C "libs/mmkv/MMKV" config "submodule.Python/pybind11.update" none || true

          for sub in libs/mmkv/MMKV libs/stub/qq-stub libs/dexkit/DexKit libs/linux-syscall-support libs/Dobby libs/libunwindstack libs/xView/EasyAdapter libs/xView/XPopup libs/fmt libs/LSPlant; do
            git -C "$sub" submodule update --init --recursive --depth 1 || git -C "$sub" submodule update --init --recursive || true
          done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_HOME/licenses/"
          echo -n 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Install ccache & ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build
          ccache -o max_size=1G
          ccache -o hash_dir=false
          ccache -o hard_link=true
          ccache -o compiler_check='%compiler% -dumpmachine; %compiler% -dumpversion'
          ccache -zp

      - name: Cache Native Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
            app/build/.lto-cache
          key: native-cache-${{ github.sha }}
          restore-keys: native-cache-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          echo 'qauxv.override.ninja.path=/usr/bin/ninja' >> local.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties

          if [ -n "${SIGN_KEYSTORE_BASE64}" ]; then
            echo "${SIGN_KEYSTORE_BASE64}" | base64 -d > keystore.jks
            export KEYSTORE_PASSWORD="${SIGN_KEYSTORE_PASSWORD}"
            export KEY_ALIAS="${SIGN_ALIAS}"
            export KEY_PASSWORD="${SIGN_KEY_PASSWORD}"
          else
            echo "No SIGN_KEYSTORE_BASE64 secret configured; generating auto-signing keystore..."
            export KEYSTORE_PASSWORD="qauxv_auto_password"
            export KEY_ALIAS="qauxv"
            export KEY_PASSWORD="qauxv_auto_password"
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=QAuxiliary, OU=Dev, O=QAuxiliary, L=Beijing, S=Beijing, C=CN"
          fi

          export KEYSTORE_PATH="../keystore.jks"
          ./gradlew :app:synthesizeDistReleaseApksCI :app:extractReleaseNativeDebugMetadata
          ccache -s
          echo "APK_FILE_ARM64=$(find app/build/outputs/ci -name '*arm64.apk')" >> "$GITHUB_ENV"
          echo "APK_FILE_ARMALL=$(find app/build/outputs/ci -name '*armAll.apk')" >> "$GITHUB_ENV"
          echo "APK_FILE_UNIVERSAL=$(find app/build/outputs/ci -name '*universal.apk')" >> "$GITHUB_ENV"
          echo "SYMBOL_FILE=app/build/intermediates/native_debug_metadata/release/extractReleaseNativeDebugMetadata/out" >> "$GITHUB_ENV"
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
          QAUXV_OVERRIDE_CMAKE_VERSION: "3.31.0"

      - name: Upload Artifacts(arm64)
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.APK_FILE_ARM64 }}
          name: QAuxiliary-release-${{ github.sha }}-arm64

      - name: Upload Artifacts(armAll)
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.APK_FILE_ARMALL }}
          name: QAuxiliary-release-${{ github.sha }}-armAll

      - name: Upload Artifacts(universal)
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.APK_FILE_UNIVERSAL }}
          name: QAuxiliary-release-${{ github.sha }}-universal

      - name: Publish APK to GitHub Releases (for direct phone download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_ARM64: ${{ env.APK_FILE_ARM64 }}
          APK_ARMALL: ${{ env.APK_FILE_ARMALL }}
          APK_UNIVERSAL: ${{ env.APK_FILE_UNIVERSAL }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "$APK_ARM64" \
            "$APK_ARMALL" \
            "$APK_UNIVERSAL" \
            --title "QAuxiliary Auto Build #${GITHUB_RUN_NUMBER}" \
            --notes "自动构建完成（已包含 Ark 卡片转旧版 structmsg 卡片适配与后台消息保活省电功能）。手机端可直接点击下方 APK 下载安装。" || true
