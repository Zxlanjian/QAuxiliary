# 一键构建「QAuxiliary + 三个新功能」的 APK
# 用法：把本文件放到 fork 的 .github/workflows/build.yml，然后在 Actions 页面手动 Run workflow
# 产物：Actions 运行页最下方的 Artifacts → TimAS-QA-arm64

name: Build TimAS-QA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/cc/ioctl/hook/chat/**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Config submodules
        run: |
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsprism.update" none
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsparself.update" none
          git -C "libs/LSPlant" config "submodule.docs/doxygen-awesome-css.update" none
          git -C "libs/mmkv/MMKV" config "submodule.Python/pybind11.update" none
          git submodule foreach git submodule update --init --recursive

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses/"
          echo -n 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Install ccache
        run: |
          sudo apt install -y ccache ninja-build
          ccache -o max_size=1G
          ccache -o hash_dir=false
          ccache -o hard_link=true

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
            app/build/.lto-cache
          key: native-${{ github.sha }}
          restore-keys: native-

      - name: Build
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          echo 'qauxv.override.ninja.path=/usr/bin/ninja' >> local.properties
          echo '' | base64 -d > keystore.jks
          ./gradlew :app:synthesizeDistReleaseApksCI
        env:
          KEYSTORE_PATH: "../keystore.jks"
          KEYSTORE_PASSWORD: "timas123456"
          KEY_ALIAS: "timas"
          KEY_PASSWORD: "timas123456"
          QAUXV_OVERRIDE_CMAKE_VERSION: "3.31.0"

      - name: Show result
        run: |
          echo "### 构建完成" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/ci -name "*.apk" -exec sha256sum {} \; | tee -a $GITHUB_STEP_SUMMARY

      - name: Upload arm64
        uses: actions/upload-artifact@v4
        with:
          name: TimAS-QA-arm64
          path: app/build/outputs/ci/*arm64.apk
          if-no-files-found: warn

      - name: Upload universal
        uses: actions/upload-artifact@v4
        with:
          name: TimAS-QA-universal
          path: app/build/outputs/ci/*universal.apk
          if-no-files-found: warn
